[package]
name = "pixer"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
# "rlib" is only so decode_bench (a bin target in this same package,
# gated behind the `bench` feature) can link against ffi::try_decode_scaled
# directly for benchmarking the real code path - Dart only ever loads the
# staticlib/cdylib output, never this rlib.
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "decode_bench"
path = "src/bin/decode_bench.rs"
required-features = ["bench"]

[dependencies]
image = "0.25.5"
libc = "0.2.177"
turbojpeg = "1.4.0"
png = "0.18.0"
# Phase 5 validation spike only (decode_bench, behind the `bench` feature) -
# not linked into the real staticlib/cdylib, and not wired into ffi.rs,
# until the spike clears its kill criterion (>=2x peak RSS win over full
# decode). See decode_bench.rs's webp-scaled mode.
libwebp-sys = { version = "0.14", optional = true }

[features]
bench = ["dep:libwebp-sys"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
